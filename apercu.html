<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><title>La Grinta en clair</title>
<style>html,body{margin:0;height:100%;background:#bfe6ff;color:#1d1b2e;font-family:Rubik,system-ui,sans-serif;overflow:hidden}#cast{display:none}#board{position:fixed;inset:0}
#ui{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:5}
#ui button{border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,#ff7a1a,#e0245e);box-shadow:0 8px 24px rgba(40,60,90,.3);white-space:nowrap}
#ui button.alt{background:#fff;color:#1d1b2e}
#tip{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(40,60,90,.2);white-space:nowrap}</style></head>
<body><div id="cast"></div><div id="board"></div>
<div id="tip">Glisse pour tourner, pince pour zoomer</div>
<div id="ui"><button id="roll">Lancer les dés 🎲</button><button class="alt" id="close">Zoom</button></div>
<script type="module">
window.__onlyBoard=true;
await import('/src/preview.js');
document.getElementById('roll').onclick=()=>window.__roll&&window.__roll();
let near=false;document.getElementById('close').onclick=(e)=>{const s=window.__scene;if(!s)return;near=!near;e.target.textContent=near?'Vue large':'Zoom';
if(near){s.camera.position.set(2.2,2.6,7.6);s.controls.target.set(3.3,0.2,4.4);}else{s.camera.position.set(0,13.5,12);s.controls.target.set(0,0,1.3);}};
</script></body></html>
